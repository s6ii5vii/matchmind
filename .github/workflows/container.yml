# Runs the tests, then builds the MatchMind container and publishes it to GitHub's registry
# (ghcr.io/<owner>/matchmind), which Azure Container Apps runs. See DEPLOY.md.
name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend

  # the whole app in a real browser: playback, the agents, matches, added time, following a question
  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          STATIC_EXPORT=1 npm run build
      - name: Start the app (rule-based agents, no keys)
        working-directory: backend
        run: |
          MATCHMIND_STATIC=../frontend/out nohup python -m uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Browser test
        working-directory: frontend
        run: APP_URL=http://127.0.0.1:8000 node e2e/smoke.mjs
      - if: failure()
        run: cat uvicorn.log

  image:
    needs: [test, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/matchmind:latest
            ghcr.io/${{ github.repository_owner }}/matchmind:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
